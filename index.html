<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F8">
<meta name="description" content="Suivi de mes séances de musculation, de mon poids, de mes pas et de mes kcal.">
<title>Sporty</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sporty">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/BarlowCondensed-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Barlow-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<script>
try{var t=localStorage.getItem('sporty:theme')||'auto',h=new Date().getHours();if(t==='dark'||(t==='auto'&&(h>=19||h<7)))document.documentElement.classList.add('dark');}catch(e){}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#semaine" aria-label="Sporty, accueil">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF8A2B"/>
            <stop offset=".55" stop-color="#F2541B"/>
            <stop offset="1" stop-color="#D9213A"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lg)"/>
        <path d="M8 31h7M6 25h6M9 19h5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
        <path d="M29.5 7 15.5 26.5h9.2L19.8 41l15.4-20.6h-9.6L31.8 7z" fill="#fff"/>
      </svg>
      <span class="wordmark">SPORT<span>Y</span></span>
    </a>
    <button class="icon-btn" id="themeBtn" data-act="cycletheme" aria-label="Changer le thème"></button>
  </header>
  <main id="view"><div class="loading">Chargement de tes séances…</div></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="t" id="timerT">2:00</div>
  <div class="lbl" id="timerL">Repos</div>
  <div class="spacer"></div>
  <button data-act="timeradd">+15 s</button>
  <button data-act="timerstop">Passer</button>
  <i class="bar" id="timerBar"></i>
</div>

<nav class="tabs" aria-label="Navigation">
  <div class="in" id="tabs"></div>
</nav>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<!-- Ordre de chargement : chaque fichier utilise ceux d'avant. -->
<script src="js/outils.js"></script>
<script src="js/exercices.js"></script>
<script src="js/stockage.js"></script>
<script src="js/sauvegarde.js"></script>
<script src="js/visuels.js"></script>
<script src="js/logique.js"></script>
<script src="js/vues.js"></script>
<script src="js/app.js"></script>
</body>
</html>
